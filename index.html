<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSim Resume Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>WebSim Resume Generator</h1>
            <p>Create a professional resume using your WebSim project data</p>
        </header>

        <div class="form-container">
            <div class="input-group">
                <label for="username">WebSim Username:</label>
                <div class="username-input">
                    <span>@</span>
                    <input type="text" id="username" placeholder="Enter your WebSim username">
                </div>
            </div>

            <div class="input-group">
                <label for="additional-info">Additional Information (optional):</label>
                <textarea id="additional-info" placeholder="Add additional information in these sections:
Skills: HTML, CSS, JavaScript, React, Node.js, etc.

Experience:
Senior Developer at Company Name (2020-Present)
- Key achievements and responsibilities

Education: 
University Name, Degree (2015-2019)

Contact:
Email: your.email@example.com
Phone: (123) 456-7890
Location: City, Country
LinkedIn: linkedin.com/in/username
Website: yourportfolio.com"></textarea>
            </div>

            <button id="generate-btn">Generate Resume</button>
        </div>

        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Analyzing your projects and generating resume...</p>
            <div id="progress-container">
                <div id="progress-bar"><div id="progress"></div></div>
                <p id="status-message">Fetching project data...</p>
            </div>
        </div>

        <div id="result" class="hidden">
            <div class="resume-controls">
                <button id="download-pdf">Download PDF</button>
                <button id="copy-html">Copy HTML</button>
                <button id="regenerate">Regenerate</button>
            </div>
            <div id="resume-preview"></div>
        </div>
    </div>
    
    <footer>
        <p>Created with WebSim AI • Your data never leaves your browser</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
